# Remote deployment, for either HTTP auth mode.
#
# The container listens only on loopback: the host's reverse proxy is the only
# thing that reaches it, and it terminates TLS for your domain. Nothing here
# opens a port to the internet directly. Set GSC_HTTP_ALLOWED_HOSTS in .env to
# your own public hostname.
services:
  gsc-mcp:
    build: .
    image: gsc-mcp-remote:local
    container_name: gsc-mcp
    restart: unless-stopped

    # 127.0.0.1 on the left is load-bearing. Binding 0.0.0.0 would expose the
    # server on the host's public interface, bypassing nginx and TLS.
    ports:
      - "127.0.0.1:${GSC_HTTP_PORT:-8787}:8787"

    # GSC_HTTP_TOKEN and GSC_OAUTH_SECRETS_FILE come from .env — see .env.example.
    env_file: .env

    environment:
      GSC_HTTP_HOST: "0.0.0.0"        # inside the container only
      GSC_HTTP_PORT: "8787"
      # The public hostname must be allow-listed or proxied requests get 403,
      # because binding 0.0.0.0 disables the SDK's localhost-only host check.
      GSC_HTTP_ALLOWED_HOSTS: "${GSC_HTTP_ALLOWED_HOSTS:?set your public hostname in .env}"
      # Cap V8's heap below the container limit so a huge Search Analytics
      # result fails as a JS error instead of getting the container OOM-killed.
      NODE_OPTIONS: "--max-old-space-size=384"

    volumes:
      # Writable: holds .gsc-mcp/oauth-token.json, refreshed in place.
      - ./data:/data
      # Read-only: the Google OAuth client secrets JSON.
      - ./secrets:/secrets:ro

    # This box also runs CloudPanel and n8n on 4 GB, with swap already in use.
    # A runaway query here must not be able to starve them.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Continuous backup of the OAuth database (users, registrations, token
  # hashes, encrypted Google refresh tokens). Opt-in, because it needs an
  # object-store bucket: fill the LITESTREAM_* vars in .env, then
  #
  #   docker compose --profile backup up -d
  #
  # Without the profile this service never starts and nothing else changes.
  #
  # Restore. --no-deps is load-bearing: `compose run` would otherwise start
  # gsc-mcp first, which creates an empty database on boot, and litestream
  # refuses to restore over an existing file. Move any current database aside
  # first for the same reason.
  #
  #   docker compose stop gsc-mcp
  #   mv data/.gsc-mcp/oauth-server.db{,.old} 2>/dev/null || true
  #   rm -f data/.gsc-mcp/oauth-server.db-wal data/.gsc-mcp/oauth-server.db-shm
  #   docker compose --profile backup run --rm --no-deps \
  #     --entrypoint litestream litestream \
  #     restore -config /etc/litestream.yml /data/.gsc-mcp/oauth-server.db
  #   docker compose up -d
  #
  # The vault key is deliberately NOT replicated — see litestream.yml.
  litestream:
    image: litestream/litestream:0.3
    container_name: gsc-mcp-litestream
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      - gsc-mcp
    command: ["replicate", "-config", "/etc/litestream.yml"]
    # Deliberately NOT env_file: .env — that would hand this sidecar the
    # bearer token and the Google client secret, none of which it needs.
    # Only the four replication credentials are passed through.
    environment:
      LITESTREAM_BUCKET: "${LITESTREAM_BUCKET:?set the backup bucket in .env}"
      LITESTREAM_ENDPOINT: "${LITESTREAM_ENDPOINT:?set the backup endpoint in .env}"
      LITESTREAM_ACCESS_KEY_ID: "${LITESTREAM_ACCESS_KEY_ID:?set the backup access key in .env}"
      LITESTREAM_SECRET_ACCESS_KEY: "${LITESTREAM_SECRET_ACCESS_KEY:?set the backup secret in .env}"
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
