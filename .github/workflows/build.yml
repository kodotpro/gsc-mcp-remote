name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # No Google credentials in CI, so this exercises what can be checked
      # without them: the server boots, completes an MCP handshake, and
      # registers every tool with the expected schema.
      - name: MCP handshake and tool-schema check (stdio)
        run: node scripts/check-tools.mjs

      - name: Health, auth and session checks (remote HTTP, bearer)
        run: node scripts/check-http.mjs

      # Provider, sandwich, PKCE, rotation, audience binding, session-user
      # binding. Skips itself on Node without node:sqlite (18/20).
      - name: OAuth mode checks
        run: node scripts/check-oauth.mjs

      # Regression tests for the production-audit fixes: SSRF address
      # classification, fetch deadlines/byte caps, report path confinement.
      - name: Hardening regression tests
        run: node scripts/check-hardening.mjs

      # Catches NEW advisories in the dependency tree. The gate is `critical`
      # rather than `high` because one high is knowingly carried: image-size
      # has no fixed release, and it is mitigated in code by refusing to hand
      # the affected formats (ICNS/JXL/HEIF) to the parser at all — which
      # scripts/check-hardening.mjs asserts.
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=critical
