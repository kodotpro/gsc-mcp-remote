name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # No Google credentials in CI, so this exercises what can be checked
      # without them: the server boots, completes an MCP handshake, and
      # registers every tool with the expected schema.
      - name: MCP handshake and tool-schema check (stdio)
        run: node scripts/check-tools.mjs

      - name: Health, auth and session checks (remote HTTP)
        run: node scripts/check-http.mjs
