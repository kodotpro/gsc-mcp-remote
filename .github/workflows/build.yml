name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The GITHUB_TOKEN needs nothing but source access: every step reads the repo,
# builds it, and runs the credential-free suites. Declared explicitly so the job
# does not silently gain write scope if the repository default is ever changed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # No Google credentials in CI, so this exercises what can be checked
      # without them: the server boots, completes an MCP handshake, and
      # registers every tool with the expected schema.
      - name: MCP handshake and tool-schema check (stdio)
        run: node scripts/check-tools.mjs

      - name: Health, auth and session checks (remote HTTP, bearer)
        run: node scripts/check-http.mjs

      # Provider, sandwich, PKCE, rotation, audience binding, session-user
      # binding. Skips itself on Node without node:sqlite (18/20).
      - name: OAuth mode checks
        run: node scripts/check-oauth.mjs

      # Regression tests for the production-audit fixes: SSRF address
      # classification, fetch deadlines/byte caps, report path confinement.
      - name: Hardening regression tests
        run: node scripts/check-hardening.mjs

      # The tree carries no accepted advisories, so this gates at `high`.
      # It used to sit at `critical` for image-size, which had no fixed release;
      # that dependency is gone — dimensions are read by src/image-dimensions.ts,
      # whose termination scripts/check-hardening.mjs asserts.
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high
